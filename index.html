<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>量化投资 Dashboard</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e7ebf2;--blue:#2563eb;--green:#0c9463}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef4ff 0,#f7f9fc 260px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--text)}main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:48px 0 72px}header{margin-bottom:28px}h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(31,41,55,.06)}.card h2{font-size:18px;margin:0 0 12px}.status{font-size:14px;color:var(--green);font-weight:700}.muted{color:var(--muted);line-height:1.65}a{color:var(--blue);text-decoration:none;font-weight:650}footer{margin-top:28px;color:var(--muted);font-size:13px}</style></head><body><main><header><h1>量化投资 Dashboard</h1><p class="sub">行业评分、风险信号与动态仓位管理</p></header><section class="grid"><article class="card"><h2>系统状态</h2><p class="status">● 报告发布链路已连接</p><p class="muted">Make 自动发布完整 HTML 报告，并通过企业微信发送摘要和访问链接。</p></article><article class="card"><h2>联调报告</h2><p class="muted">用于验证 GitHub 写入、静态网页与企业微信推送链路。</p><a href="test/make-integration-check.html">查看联调报告 →</a></article><article class="card"><h2>板块报告</h2><p class="muted">半导体、创新药、光通信等正式报告将在检测后自动归档。</p></article></section><footer>Quant Reports · Steven-Fan-Git</footer></main></body></html>
